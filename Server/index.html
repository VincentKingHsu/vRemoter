<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>vRemoter · 版本与下载</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#f0f2f4;background:#0e0f11}
    body{margin:0}.wrap{width:min(760px,calc(100% - 40px));margin:0 auto;padding:72px 0}a{color:#4fd187}h1{font-size:42px;margin:0 0 12px}.lead{color:#9aa0a8;line-height:1.7}.panel{margin-top:34px;padding:24px;border:1px solid #34373c;border-radius:10px;background:#15171a}.status{color:#f59c31;font-weight:700}.downloads{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.download{padding:18px;border:1px solid #34373c;border-radius:8px}.download h2{font-size:18px}.download p{min-height:70px;color:#9aa0a8;line-height:1.6}.download a{display:inline-block;padding:10px 13px;border-radius:7px;background:#4fd187;color:#07120c;font-weight:750;text-decoration:none}.download a[aria-disabled="true"]{pointer-events:none;opacity:.4}.back{display:inline-block;margin-top:32px}@media(max-width:640px){h1{font-size:34px}.downloads{grid-template-columns:1fr}.download p{min-height:0}}
  </style>
</head>
<body>
  <main class="wrap">
    <p class="status">Vincent Studio</p>
    <h1>vRemoter 版本与下载</h1>
    <p class="lead">首次安装需要 PKG，它会安装 APP 与音频驱动。已经完成首次安装、且本次驱动没有变化时，可以使用 DMG 只更新 APP。</p>
    <section class="panel">
      <p id="release-status" class="status">正式下载正在准备中</p>
      <div class="downloads">
        <article class="download">
          <h2>PKG · 首次安装</h2>
          <p>包含 vRemoter APP 和 vRemote 音频驱动。驱动有变化时也必须使用 PKG。</p>
          <a id="pkg-link" href="#" aria-disabled="true">暂未开放</a>
        </article>
        <article class="download">
          <h2>DMG · 仅更新 APP</h2>
          <p>适合已经安装过驱动的用户。不会重新安装或修改音频驱动。</p>
          <a id="dmg-link" href="#" aria-disabled="true">暂未开放</a>
        </article>
      </div>
    </section>
    <a class="back" href="https://vremoter.vincentstudio.org">← 返回 vRemoter 官网</a>
  </main>
  <script>
    fetch('releases.json', {cache: 'no-store'})
      .then((response) => response.ok ? response.json() : Promise.reject())
      .then((releases) => releases.find((release) => !release.draft && !release.prerelease))
      .then((release) => {
        if (!release) return;
        document.querySelector('#release-status').textContent = `${release.name} · ${release.body || ''}`;
        for (const extension of ['pkg', 'dmg']) {
          const asset = release.assets.find((item) => item.name.toLowerCase().endsWith(`.${extension}`));
          if (!asset) continue;
          const link = document.querySelector(`#${extension}-link`);
          link.href = asset.browser_download_url;
          link.textContent = `下载 ${asset.name}`;
          link.removeAttribute('aria-disabled');
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
