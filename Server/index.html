<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>vRemoter · 版本与下载</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#f0f2f4;background:#0e0f11}
    body{margin:0}.wrap{width:min(760px,calc(100% - 40px));margin:0 auto;padding:72px 0}a{color:#4fd187}h1{font-size:42px;margin:0 0 12px}.lead{color:#9aa0a8;line-height:1.7}.panel{margin-top:34px;padding:24px;border:1px solid #34373c;border-radius:10px;background:#15171a}.status{color:#f59c31;font-weight:700}.downloads{display:grid;grid-template-columns:1fr;gap:12px;margin-top:22px}.download{padding:18px;border:1px solid #34373c;border-radius:8px}.download h2{font-size:18px}.download p{color:#9aa0a8;line-height:1.6}.download a{display:inline-block;padding:10px 13px;border-radius:7px;background:#4fd187;color:#07120c;font-weight:750;text-decoration:none}.notice{margin-top:16px;padding:14px;border-left:3px solid #f59c31;background:#1b1814;color:#c8c1b7;line-height:1.6}.digest{overflow-wrap:anywhere;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#777f88}.back{display:inline-block;margin-top:32px}@media(max-width:640px){h1{font-size:34px}}
  </style>
</head>
<body>
  <main class="wrap">
    <p class="status">Vincent Studio</p>
    <h1>vRemoter 版本与下载</h1>
    <p class="lead">首次安装请选择 PKG，它会一次安装 vRemoter APP 与音频驱动。已经安装过驱动的用户，可在驱动没有变化时使用 DMG 只更新 APP。</p>
    <section class="panel">
      <p id="release-status" class="status">正在读取最新版本…</p>
      <div id="downloads" class="downloads"></div>
      <p class="notice">当前 PKG 尚未完成 Apple Developer ID 签名与公证。macOS 可能提示无法验证开发者；这是签名状态提示，不代表下载损坏。正式广泛分发前仍会补齐签名与公证。</p>
    </section>
    <a class="back" href="https://vremoter.vincentstudio.org">← 返回 vRemoter 官网</a>
  </main>
  <script>
    fetch('releases.json', {cache: 'no-store'})
      .then((response) => response.ok ? response.json() : Promise.reject())
      .then((releases) => releases.find((release) => !release.draft && !release.prerelease))
      .then((release) => {
        if (!release) return;
        document.querySelector('#release-status').textContent = `${release.name} · ${release.body || ''}`;
        const downloads = document.querySelector('#downloads');
        const descriptions = {
          pkg: '包含 vRemoter APP 和 vRemote 音频驱动，适合首次安装；以后驱动有变化时也使用 PKG。',
          dmg: '只更新 vRemoter APP，不重新安装或修改音频驱动。'
        };
        for (const extension of ['pkg', 'dmg']) {
          const asset = release.assets.find((item) => item.name.toLowerCase().endsWith(`.${extension}`));
          if (!asset) continue;
          const article = document.createElement('article');
          article.className = 'download';
          const digest = asset.digest?.replace(/^sha256:/i, '') || '';
          article.innerHTML = `
            <h2>${extension.toUpperCase()} · ${extension === 'pkg' ? '首次安装' : '仅更新 APP'}</h2>
            <p>${descriptions[extension]}</p>
            <a href="${asset.browser_download_url}">下载 ${asset.name}</a>
            ${digest ? `<p class="digest">SHA-256：${digest}</p>` : ''}`;
          downloads.appendChild(article);
        }
        if (!downloads.children.length) {
          document.querySelector('#release-status').textContent = '当前版本暂时没有可下载文件';
        }
      })
      .catch(() => {
        document.querySelector('#release-status').textContent = '暂时无法读取下载信息，请稍后刷新';
      });
  </script>
</body>
</html>
